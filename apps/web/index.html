<!doctype html>
<html lang="en" data-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the shell can paint under the notch and home
         indicator; interactive-widget keeps Android from resizing the layout
         viewport out from under a focused composer. -->
    <!-- No pinch zoom: the interface has a zoom of its own, in Settings ›
         Appearance, and it reflows rather than panning a magnified page. A
         browser's zoom fights that one — it scales a layout already sized to
         the viewport, so the composer ends up off the edge of the screen. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Picone" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Picone</title>
    <script>
      // Set the scheme before first paint so there is no light flash.
      try {
        const stored = localStorage.getItem("picone:color-scheme");
        document.documentElement.dataset.colorScheme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
